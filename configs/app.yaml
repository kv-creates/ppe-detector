# Application configuration
api:
  host: 127.0.0.1
  port: 8000
ui:
  host: 127.0.0.1
  port: 8501
model:
  # resolved in order: colab-trained final > smoke baseline > coco placeholder
  candidates:
    - models/checkpoints/yolov8_final/weights/best.pt
